<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="960" height="410" fill="#ffffff"/>
  <style>
    .t{font-size:13px;fill:#222;text-anchor:middle}
    .s{font-size:11.5px;fill:#555;text-anchor:middle}
    .h{font-size:15px;font-weight:bold;fill:#222;text-anchor:middle}
    .in{fill:#edf2f7;stroke:#555}
    .kn{fill:#ebf8ff;stroke:#2b6cb0}
    .le{fill:#fffaf0;stroke:#c05621}
    .ou{fill:#f0fff4;stroke:#2f855a}
    .box{fill:none;stroke:#999;stroke-dasharray:5 4}
    .l{stroke:#444;stroke-width:1.5;fill:none}
  </style>

  <text class="h" x="120" y="26">What you provide</text>
  <rect class="in" x="20" y="44" width="200" height="60" rx="6"/>
  <text class="t" x="120" y="68">hypergraph S</text>
  <text class="s" x="120" y="87">reactions, mesh or point cloud</text>
  <rect class="in" x="20" y="118" width="200" height="76" rx="6"/>
  <text class="t" x="120" y="142">conditions θ</text>
  <text class="s" x="120" y="161">T, potential U, drive, chemostat levels,</text>
  <text class="s" x="120" y="177">chemostat standard free energies</text>
  <rect class="in" x="20" y="208" width="200" height="60" rx="6"/>
  <text class="t" x="120" y="232">trajectories c(t)</text>
  <text class="s" x="120" y="251">descriptors ξ are optional</text>

  <text class="h" x="480" y="26">The Neural Chart library (the same for every task)</text>
  <rect class="box" x="265" y="38" width="430" height="236" rx="8"/>
  <rect class="le" x="285" y="52" width="185" height="64" rx="6"/>
  <text class="t" x="377" y="76">excess free energy G_θ(c)</text>
  <text class="s" x="377" y="96">network, gives y = log c + ∇G_θ</text>
  <rect class="le" x="490" y="52" width="185" height="64" rx="6"/>
  <text class="t" x="582" y="76">mobility g_θ(class, ξ, c̄)</text>
  <text class="s" x="582" y="96">network, gives k, never reads θ</text>
  <rect class="kn" x="285" y="136" width="390" height="56" rx="6"/>
  <text class="t" x="480" y="158">known formulas on S: force f, factor ε</text>
  <text class="s" x="480" y="177">a, b = k ε exp(±f/2), with μ⁰ learned for internal species</text>
  <rect class="kn" x="285" y="208" width="390" height="52" rx="6"/>
  <text class="t" x="480" y="229">chart.fit: convex start on class constants, then rollouts</text>
  <text class="s" x="480" y="247">master equation ċ = S (a − b), positive adaptive integrator</text>
  <path class="l" d="M377 116 L377 136" marker-end="url(#ar)"/>
  <path class="l" d="M582 116 L582 136" marker-end="url(#ar)"/>
  <path class="l" d="M480 192 L480 208" marker-end="url(#ar)"/>

  <text class="h" x="840" y="26">What you get</text>
  <rect class="ou" x="740" y="44" width="200" height="60" rx="6"/>
  <text class="t" x="840" y="68">rollouts at new conditions</text>
  <text class="s" x="840" y="87">no retraining</text>
  <rect class="ou" x="740" y="118" width="200" height="76" rx="6"/>
  <text class="t" x="840" y="142">physics of every step</text>
  <text class="s" x="840" y="161">flux, force, mobility, excess potential,</text>
  <text class="s" x="840" y="177">entropy production, cycle affinity</text>
  <rect class="ou" x="740" y="208" width="200" height="60" rx="6"/>
  <text class="t" x="840" y="232">compose(a, b)</text>
  <text class="s" x="840" y="251">a chart of a larger system</text>

  <path class="l" d="M220 74 L265 110" marker-end="url(#ar)"/>
  <path class="l" d="M220 156 L265 156" marker-end="url(#ar)"/>
  <path class="l" d="M220 238 L265 205" marker-end="url(#ar)"/>
  <path class="l" d="M695 110 L740 74" marker-end="url(#ar)"/>
  <path class="l" d="M695 156 L740 156" marker-end="url(#ar)"/>
  <path class="l" d="M695 205 L740 238" marker-end="url(#ar)"/>

  <text class="h" x="480" y="312" style="font-size:14px">At a new condition θ′</text>
  <rect class="in" x="120" y="326" width="210" height="60" rx="6"/>
  <text class="t" x="225" y="350">new θ′</text>
  <text class="s" x="225" y="369">temperature, drive, potential, chemostats</text>
  <rect class="kn" x="375" y="326" width="210" height="60" rx="6"/>
  <text class="t" x="480" y="350">recompute f and ε</text>
  <text class="s" x="480" y="369">no learned parameter changes</text>
  <rect class="ou" x="630" y="326" width="210" height="60" rx="6"/>
  <text class="t" x="735" y="350">same k and G_θ</text>
  <text class="s" x="735" y="369">a new point on the same manifold</text>
  <path class="l" d="M330 356 L375 356" marker-end="url(#ar)"/>
  <path class="l" d="M585 356 L630 356" marker-end="url(#ar)"/>
</svg>
