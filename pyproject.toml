[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralchart"
version = "1.0.0"
description = "The Neural Chart: a thermodynamically consistent learned master equation on graphs and hypergraphs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
bench = ["matplotlib>=3.8", "pillow>=10", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["neuralchart*"]
